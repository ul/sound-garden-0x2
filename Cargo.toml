[package]
name = "sound-garden-0x2"
version = "0.1.0"
authors = ["Ruslan Prokopchuk <fer.obbee@gmail.com>"]
edition = "2024"

[workspace]
resolver = "3"
default-members = [".", "render_program"]

members = [
    "audio_ops",
    "audio_program",
    "audio_server",
    "audio_vm",
    "book/render",
    "play_program",
    "render_program",
    "sound_garden_egui",
    "sound_garden_format",
    "sound_garden_program",
    "sound_garden_types",
    "sound_garden_web",
    "thread_worker"
]

[workspace.dependencies]
anyhow = "1.0.104"
rkyv = "0.8.18"
ciborium = "0.2.2"
clap = { version = "4.6.7", features = ["cargo"] }
cpal = "0.18.2"
crossbeam-channel = "0.5.17"
downcast-rs = "2.0.2"
foldhash = "0.2.0"
eframe = "0.36.2"
egui = "0.36.2"
hound = "3.5.1"
itertools = "0.15.0"
jiff = "0.2.37"
log = "0.4.34"
micromath = "2.1.0"
midir = "0.11.0"
nom = "8.0.0"
rand = "0.10.3"
rtrb = "0.4.0"
rustfft = "6.4.1"
serde = { version = "1.0.229", features = ["derive"] }
simple_logger = "5.2.0"
smallvec = "1.16.2"
snap = "1.1.2"
symphonia = { version = "0.6.1", features = ["all"] }

[dev-dependencies]
audio_program = { path = "audio_program" }
audio_vm = { path = "audio_vm" }
criterion = "0.8.2"
smallvec.workspace = true

[[bench]]
name = "performance"
harness = false

[[bench]]
name = "microstructure"
harness = false

[profile.release]
panic = "abort"

# Opt-in for builds you perform with: `cargo build --profile dist`.
# Fat LTO + one codegen unit measured 0-8% faster per frame (≈5% on synth
# and spectral benches) but makes a one-file rebuild ~4x slower (25 s vs 6 s),
# so plain `release` stays tuned for iteration.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
