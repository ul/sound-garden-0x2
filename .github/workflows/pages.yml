name: Publish Sound Garden browser apps and book

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - run: cargo test --locked -p sound_garden_format -p sound_garden_web
      - run: make -C sound_garden_web
      - run: |
          node --check sound_garden_web/web/editor-store.js
          node --check sound_garden_web/web/editor/editor.js
          test -s sound_garden_web/dist/editor/pkg/sound_garden_egui_bg.wasm
      # The book (book/), published under book/: finished chapters only.
      - run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          sudo gem install asciidoctor rouge --no-document
      - run: make -C book final
      - run: cp -R book/build sound_garden_web/dist/book
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: sound_garden_web/dist
      - id: deployment
        uses: actions/deploy-pages@v5
